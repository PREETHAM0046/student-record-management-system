<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app-container">


        <!-- Top Bar -->

        <header class="app-header">

            <div>

                <h1>🎓 Student Record System</h1>

                <p>Update Student</p>

            </div>


            <button class="logout-button" onclick="goBack()">

                ← Back

            </button>

        </header>



        <!-- Welcome Card -->

        <section class="welcome-card">

            <div>

                <h2>✏️ Update Student</h2>

                <p>

                    Search and update student information.

                </p>

            </div>


            <div class="teacher-icon">

                📝

            </div>

        </section>



        <!-- Update Section -->

        <section class="update-section">


            <!-- Search -->

            <div class="update-search">

                <div>

                    <h2>🔍 Find Student</h2>

                    <p>Search using student name or USN.</p>

                </div>


                <div class="student-search">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="searchStudent"
                        placeholder="Search name or USN..."
                    >

                </div>

            </div>



            <!-- Student Selection -->

            <div id="studentResults">

                <p class="loading-text">

                    Loading students...

                </p>

            </div>



            <!-- Edit Form -->

            <div id="editStudentArea" class="edit-student-area hidden">

                <h2>📝 Edit Student Details</h2>

                <p class="edit-subtitle">

                    Update the information and save your changes.

                </p>


                <form id="updateStudentForm">


                    <div class="form-grid">


                        <div class="form-group">

                            <label>Student Name</label>

                            <input
                                type="text"
                                id="editName"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>USN</label>

                            <input
                                type="text"
                                id="editUSN"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Branch</label>

                            <input
                                type="text"
                                id="editBranch"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Semester</label>

                            <input
                                type="number"
                                id="editSemester"
                                min="1"
                                max="8"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Section</label>

                            <input
                                type="text"
                                id="editSection"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Email</label>

                            <input
                                type="email"
                                id="editEmail"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>Phone Number</label>

                            <input
                                type="tel"
                                id="editPhone"
                                required
                            >

                        </div>


                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            class="cancel-button"
                            onclick="cancelEdit()"
                        >

                            ✖ Cancel

                        </button>


                        <button
                            type="submit"
                            class="save-button"
                        >

                            💾 Save Changes

                        </button>

                    </div>


                </form>

            </div>


        </section>



        <!-- Footer -->

        <footer class="app-footer">

            <p>

                Created by <strong>Preetham.G</strong>

            </p>

        </footer>


    </div>



    <script src="update-student.js"></script>


</body>

</html>
